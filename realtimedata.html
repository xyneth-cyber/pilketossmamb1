<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data Pemilih - PILKETOS SMA MB 1</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- App Logo -->
    <link rel="icon" href="logo.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mbBlue: '#1d4ed8',
                        mbBlueDark: '#1e3a8a',
                        mbBlueLight: '#3b82f6',
                        mbSky: '#dbeafe',
                        mbBg: '#f8fafc'
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Polo';
            src: local('Polo'), local('Polo-Regular'), local('Arial');
        }

        body, button, input, select {
            font-family: 'Polo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }

        .title-polo {
            font-family: 'Polo', sans-serif;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- HEADER / NAVBAR -->
    <header class="bg-mbBlueDark text-white shadow-md sticky top-0 z-40 border-b border-blue-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3 cursor-pointer select-none">
                    <img src="logo.png" alt="MB" class="w-12 h-12 flex">
                    <div>
                        <h1 class="text-xl font-bold tracking-tight title-polo">
                            SMA Mutiara Bangsa 1
                        </h1>
                        <p class="text-xs text-blue-200 font-medium">Realtime Voting Feed</p>
                    </div>
                </div>
                <!-- Indikator Live Status -->
                <div class="flex items-center gap-2 bg-blue-900/60 px-3.5 py-1.5 rounded-full text-xs font-semibold text-emerald-400 border border-emerald-500/30 shadow-inner">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>LIVE</span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200">
            <!-- Header Section -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900 title-polo flex items-center gap-2">
                        <i class="fa-solid fa-users text-mbBlue"></i> Data Pemilih Realtime
                    </h2>
                    <p class="text-slate-500 text-xs mt-1">Daftar siswa & guru yang baru saja memberikan suara</p>
                </div>
                <div class="flex items-center gap-2">
                    <span id="total-voters-count" class="text-xs bg-mbSky text-mbBlue font-bold px-4 py-2 rounded-full border border-blue-200 shadow-sm">
                        0 Suara Masuk
                    </span>
                </div>
            </div>

            <!-- Tabel Pemilih -->
            <div class="overflow-x-auto rounded-2xl border border-slate-200 shadow-sm">
                <table class="w-full text-sm text-left text-slate-700">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
                        <tr>
                            <th scope="col" class="px-5 py-3.5 text-center w-16">No</th>
                            <th scope="col" class="px-5 py-3.5">Nama Pemilih</th>
                            <th scope="col" class="px-5 py-3.5 text-center w-36">Kelas Pemilih</th>
                        </tr>
                    </thead>
                    <tbody id="voters-table-body">
                        <tr>
                            <td colspan="3" class="px-4 py-8 text-center text-slate-400">
                                <i class="fa-solid fa-circle-notch animate-spin text-2xl text-mbBlue mb-2 block"></i>
                                Memuat data pemilih...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-mbBlueDark text-blue-200 py-6 border-t border-blue-900 text-center text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>© SMA Mutiara Bangsa 1 - Pilketos Digital System</p>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Ambil data pertama kali
            loadRealtimeVoters();

            // Refresh otomatis setiap 3 detik
            setInterval(loadRealtimeVoters, 3000);
        });

        async function loadRealtimeVoters() {
            try {
                const res = await fetch('/api/voters');
                const data = await res.json();

                if (data && data.voters && Array.isArray(data.voters)) {
                    renderVotersTable(data.voters);
                }
            } catch (e) {
                console.error("Gagal mengambil data pemilih:", e);
            }
        }

        function renderVotersTable(voters) {
            const tbody = document.getElementById('voters-table-body');
            const countBadge = document.getElementById('total-voters-count');

            countBadge.textContent = `${voters.length} Suara Masuk`;

            if (voters.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="px-4 py-8 text-center text-slate-400 font-medium">
                            <i class="fa-solid fa-inbox text-3xl mb-2 block text-slate-300"></i>
                            Belum ada suara yang masuk.
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = voters.map((voter, index) => `
                <tr class="border-b border-slate-100 hover:bg-blue-50/50 transition">
                    <td class="px-5 py-3.5 text-center font-semibold text-slate-400">${index + 1}</td>
                    <td class="px-5 py-3.5 font-bold text-slate-800">${voter.nama}</td>
                    <td class="px-5 py-3.5 text-center font-medium text-slate-600 bg-slate-50/80">${voter.kelas}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
