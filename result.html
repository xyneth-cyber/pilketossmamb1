<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PILKETOS - SMA Mutiara Bangsa 1</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Logo -->
    <link rel="icon" href="logo.png">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mbBlue: '#1d4ed8',      /* Biru Utama Sekolah */
                        mbBlueDark: '#1e3a8a',  /* Biru Tua Navbar/Footer */
                        mbBlueLight: '#3b82f6', /* Biru Accent */
                        mbSky: '#dbeafe',       /* Biru Muda Accent */
                        mbBg: '#f8fafc'         /* Background */
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Polo';
            src: local('Polo'), local('Polo-Regular'), local('Arial');
        }

        body, button, input, select {
            font-family: 'Polo', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }

        .title-polo {
            font-family: 'Polo', sans-serif;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- HEADER / NAVBAR -->
    <header class="bg-mbBlueDark text-white shadow-md sticky top-0 z-40 border-b border-blue-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo Sekolah (Klik 3x untuk buka Login Admin Rahasia) -->
                <div class="flex items-center space-x-3 cursor-pointer select-none" onclick="handleLogoClick()">
                    <!--<div class="w-12 h-12 bg-white text-mbBlue rounded-xl flex items-center justify-center font-black text-xl shadow-md border-2 border-mbBlueLight">
                
                    </div>-->
                    <img src="logo.png" alt="MB" class="w-12 h-12 flex">
                    <div>
                        <h1 class="text-xl font-bold tracking-tight title-polo">
                            SMA Mutiara Bangsa 1
                        </h1>
                        <p class="text-xs text-blue-200 font-medium">Sistem Pemilihan Ketua OSIS Digital</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <!-- PUBLIC STATISTICAL CHARTS -->
        <section id="section-stats" class="space-y-8">
            <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 title-polo flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-mbBlue"></i> Hasil Pemilihan Ketua dan Wakil Ketua Osis
                    </h2>
                    <p class="text-slate-500 text-xs mt-1">Perolehan suara secara keseluruhan</p>
                </div>

                <div class="grid lg:grid-cols-1 gap-8">
                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col items-center">
                        <h3 class="font-bold text-slate-800 text-sm mb-4 text-center">🏆 Total Perolehan Suara Keseluruhan</h3>
                        <div class="w-full h-64 relative flex items-center justify-center">
                            <canvas id="chart-overall-pie"></canvas>
                        </div>
                    </div>
                  </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-mbBlueDark text-blue-200 py-6 border-t border-blue-900 text-center text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>© SMA Mutiara Bangsa 1 - Pilketos Digital System</p>
            <!-- <button onclick="openAdminModal()" class="text-blue-400 hover:text-white transition text-xs flex items-center gap-1 opacity-60 hover:opacity-100">
                <i class="fa-solid fa-lock text-[10px]"></i> Admin
            </button> -->
        </div>
    </footer>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        let pieChartInstance = null;

        // Load pie saat halaman dimuat
        window.addEventListener('DOMContentLoaded', async () => {
            loadPublicStats();
        });

        async function loadPublicStats() {
            let totalData = [0, 0, 0];

            try {
                const res = await fetch('/api/stats/public');
                const data = await res.json();

                // Pop-up 1: Cek respon mentah dari server
                //alert("1. Response API:\n" + JSON.stringify(data, null, 2));

                if (data && data.total && Array.isArray(data.total)) {
                    data.total.forEach(item => {
                        const paslonNum = Number(item.pilih_nomor_berapa);
                        if (paslonNum >= 1 && paslonNum <= 3) {
                            totalData[paslonNum - 1] = Number(item.total);
                        }
                    });
                }
            } catch (e) {
                alert("Error Fetching API:\n" + e.message);
            }

            // Pop-up 2: Cek data angka yang masuk ke chart
            //alert("2. Hasil Array Chart:\n" + JSON.stringify(totalData));

            const ctxPie = document.getElementById('chart-overall-pie').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();

            pieChartInstance = new Chart(ctxPie, {
                type: 'pie',
                data: {
                    labels: ['Paslon 01', 'Paslon 02', 'Paslon 03'],
                    datasets: [{
                        data: totalData,
                        backgroundColor: ['#2563eb', '#1d4ed8', '#1e3a8a'],
                        borderWidth: 3,
                        borderColor: '#ffffff'
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }
    </script>
</body>
</html>
